<!-- Panel Enkripsi & Dekripsi Berkas -->
<section class="panel" id="panel-berkas">
    <h1>Enkripsi &amp; Dekripsi Berkas</h1>
    <p class="lede">
        Unggah berkas apa pun (dokumen, gambar, PDF). Berkas hasil enkripsi
        memakai ekstensi <code>.krp</code> dan menyimpan salt, nonce, serta
        metadata algoritma dalam binary envelope untuk didekripsi kembali.
    </p>

    <div class="grid two">
        <div class="card">
            <h2>Enkripsi Berkas</h2>
            <label
                >Algoritma
                <select id="f-algo">
                    <option value="aes-gcm">AES-256-GCM</option>
                    <option value="chacha20">ChaCha20-Poly1305</option>
                </select>
            </label>
            <label
                >Key Derivation Function (KDF)
                <select id="f-kdf">
                    <option value="pbkdf2">PBKDF2-HMAC-SHA256</option>
                    <option value="scrypt">scrypt</option>
                    <option value="argon2">Argon2id</option>
                </select>
            </label>
            <label
                >Kata Sandi
                <input
                    type="password"
                    id="f-password-enc"
                    placeholder="Kata sandi enkripsi"
                />
            </label>
            <label
                >Pilih Berkas
                <input type="file" id="f-file-enc" />
            </label>
            <div class="btn-row">
                <button class="btn primary" id="f-encrypt-btn">
                    Enkripsi &amp; Unduh (.krp)
                </button>
            </div>
            <div id="f-enc-status" class="status"></div>
        </div>

        <div class="card">
            <h2>Dekripsi Berkas</h2>
            <label
                >Kata Sandi
                <input
                    type="password"
                    id="f-password-dec"
                    placeholder="Kata sandi dekripsi"
                />
            </label>
            <label
                >Pilih Berkas Terenkripsi (.krp)
                <input type="file" id="f-file-dec" />
            </label>
            <div class="btn-row">
                <button class="btn secondary" id="f-decrypt-btn">
                    Dekripsi &amp; Unduh Asli
                </button>
            </div>
            <div id="f-dec-status" class="status"></div>
        </div>
    </div>
</section>
