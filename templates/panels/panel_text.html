<!-- Panel Enkripsi & Dekripsi Teks -->
<section class="panel active" id="panel-teks">
    <h1>Enkripsi &amp; Dekripsi Teks</h1>
    <p class="lede">
        Pilih mau mengunci atau membuka pesan. Hasil terkunci aman disalin dalam format Base64 atau heksadesimal.
    </p>

    <fieldset class="mode-toggle" id="t-mode">
        <legend class="sr-only">Mode</legend>
        <label class="mode-opt"><input type="radio" name="t-mode" value="encrypt" checked /> <i data-lucide="lock"></i> Enkripsi</label>
        <label class="mode-opt"><input type="radio" name="t-mode" value="decrypt" /> <i data-lucide="lock-open"></i> Dekripsi</label>
    </fieldset>

    <div id="t-encrypt-view">
    <div class="grid two">
        <div class="card">
            <h2>Pesan + Kata Sandi</h2>
            <label
                >Kata Sandi <span class="hint">(min 8 karakter)</span>
                <span class="pw-wrap">
                <input
                    type="password"
                    id="t-password"
                    placeholder="Masukkan kata sandi"
                    autocomplete="new-password"
                    minlength="8"
                />
                <button type="button" class="pw-toggle" data-for="t-password" aria-label="Tampilkan kata sandi"><i data-lucide="eye"></i></button>
                </span>
                <span class="field-error" id="t-password-err" role="alert"></span>
            </label>
            <label
                >Pesan Asli
                <textarea
                    id="t-plaintext"
                    rows="7"
                    placeholder="Tulis pesan yang akan dikunci..."
                ></textarea>
                <span class="field-error" id="t-plaintext-err" role="alert"></span>
            </label>
            <div class="btn-row">
                <button class="btn primary" id="t-encrypt-btn">
                    Enkripsi &rarr;
                </button>
            </div>
        </div>

        <div class="card">
            <h2>Hasil Terkunci</h2>
            <label
                >Hasil (siap salin)
                <textarea
                    id="t-ciphertext"
                    rows="5"
                    readonly
                    placeholder="Hasil enkripsi muncul di sini..."
                ></textarea>
            </label>
            <div class="meta-row" id="t-meta"></div>
            <div class="btn-row">
                <button class="btn ghost" id="t-copy-btn">Salin Hasil</button>
            </div>
            <div id="t-result" class="result-box" role="status" aria-live="polite"></div>
        </div>
    </div>
    </div>

    <div id="t-decrypt-view" hidden>
    <div class="card">
        <h2>Buka Pesan Terkunci</h2>
        <label
            >Tempel Hasil Terkunci
            <textarea
                id="t-ciphertext-dec"
                rows="5"
                placeholder="Tempel Base64 / hex dari hasil enkripsi..."
            ></textarea>
            <span class="field-error" id="t-ciphertext-dec-err" role="alert"></span>
        </label>
        <label
            >Kata Sandi Pembuka
            <span class="pw-wrap">
            <input type="password" id="t-password-dec" placeholder="Kata sandi yang sama saat mengunci" autocomplete="current-password" />
            <button type="button" class="pw-toggle" data-for="t-password-dec" aria-label="Tampilkan kata sandi"><i data-lucide="eye"></i></button>
            </span>
        </label>
        <div class="btn-row">
            <button class="btn secondary" id="t-decrypt-btn">
                &larr; Dekripsi
            </button>
        </div>
        <div id="t-result-dec" class="result-box" role="status" aria-live="polite"></div>
    </div>
    </div>

    <details class="card advanced">
        <summary>Pengaturan Lanjutan (Algoritma &amp; KDF)</summary>
        <div class="grid two">
            <label
                >Algoritma
                <select id="t-algo">
                    <option value="aes-gcm">AES-256-GCM — cepat di laptop</option>
                    <option value="chacha20">
                        ChaCha20-Poly1305 — cepat di HP
                    </option>
                </select>
            </label>
            <label
                >Pengacak Kunci (KDF)
                <select id="t-kdf">
                    <option value="pbkdf2">
                        PBKDF2 (standar, kompatibel)
                    </option>
                    <option value="scrypt">scrypt (tahan GPU)</option>
                    <option value="argon2">Argon2id (paling kuat)</option>
                </select>
            </label>
            <label
                >Format Tampilan
                <select id="t-encoding">
                    <option value="base64">Base64 (pendek)</option>
                    <option value="hex">Heksadesimal</option>
                </select>
            </label>
        </div>
    </details>
</section>
