<!-- Panel Analisis Avalanche Effect & Entropi -->
<section class="panel" id="panel-analisis">
    <h1>Cek Keacakan (Avalanche &amp; Entropi)</h1>
    <p class="lede">
        Ubah 1 huruf seharusnya mengubah ~50% hasil terkunci (avalanche), dan hasil harus acak (entropi mendekati 8 dari 8).
    </p>

    <div class="card">
        <h2>Coba Sekarang</h2>
        <div class="grid two">
            <div>
                <label
                    >Teks Contoh
                    <input
                        type="text"
                        id="a-plaintext"
                        value="Contoh teks untuk uji avalanche effect dan entropi."
                    />
                </label>
                <label
                    >Kata Sandi
                    <input
                        type="password"
                        id="a-password"
                        value="analisis-cepat-2026"
                    />
                </label>
            </div>
            <div>
                <label
                    >Algoritma
                    <select id="a-algo">
                        <option value="aes-gcm">AES-256-GCM — cepat di laptop</option>
                        <option value="chacha20">ChaCha20-Poly1305 — cepat di HP</option>
                    </select>
                </label>
                <p class="hint">Ideal: avalanche 48–52%, entropi ciphertext &gt; 7.5</p>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn primary" id="a-run-btn">
                Hitung Keacakan
            </button>
        </div>
    </div>

    <div id="a-output" class="grid two" aria-live="polite"></div>
</section>
