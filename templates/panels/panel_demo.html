<!-- Panel Demo Skenario Wajib UTS -->
<section class="panel" id="panel-demo">
    <h1>Cek Keamanan Otomatis (Demo UTS)</h1>
    <p class="lede">
        Satu klik menjalankan 5 cek wajib: kunci berkas, lihat hasil, buka dengan sandi benar, pastikan sandi salah ditolak, pastikan file diubah ditolak.
    </p>

    <div class="card">
        <h2>1. Siapkan Uji</h2>
        <div class="grid two">
            <div>
                <label
                    >Algoritma
                    <select id="d-algo">
                        <option value="aes-gcm">AES-256-GCM — cepat di laptop</option>
                        <option value="chacha20">ChaCha20-Poly1305 — cepat di HP</option>
                    </select>
                </label>
                <label
                    >Pengacak Kunci
                    <select id="d-kdf">
                        <option value="pbkdf2">PBKDF2 (standar)</option>
                        <option value="scrypt">scrypt (tahan GPU)</option>
                        <option value="argon2">Argon2id (paling kuat)</option>
                    </select>
                </label>
            </div>
            <div>
                <label
                    >Kata Sandi Uji
                    <span class="pw-wrap">
                    <input
                        type="text"
                        id="d-password"
                        value="DemoUTS-2026!"
                    />
                    </span>
                </label>
                <label
                    >Berkas Uji (PDF / gambar / teks)
                    <input type="file" id="d-file" />
                    <span class="field-error" id="d-file-err" role="alert"></span>
                </label>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn primary" id="d-run-btn">
                Jalankan 5 Cek &rarr;
            </button>
        </div>
        <div class="progress" id="d-progress" hidden><div class="progress-bar"></div></div>
    </div>

    <div id="d-output" aria-live="polite"></div>
</section>
