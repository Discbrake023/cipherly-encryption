<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% block title %}Cipherly &mdash; Aplikasi Enkripsi Modern{%
            endblock %}
        </title>

        <!-- Google Fonts: DM Sans & JetBrains Mono (Green Deck Design System) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
            rel="stylesheet"
        />

        <!-- Core Modular Stylesheets -->
        <link rel="stylesheet" href="/static/css/variables.css" />
        <link rel="stylesheet" href="/static/css/base.css" />
        <link rel="stylesheet" href="/static/css/components.css" />
        {% block styles %}{% endblock %}
    </head>
    <body>
        {% block content %}{% endblock %} {% block scripts %}{% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                if (window.lucide) window.lucide.createIcons();
            });
        </script>
    </body>
</html>
